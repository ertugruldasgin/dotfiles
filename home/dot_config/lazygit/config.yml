gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
  theme:
    activeBorderColor:
      - "#88c0d0"
      - bold
    inactiveBorderColor:
      - "#4c566a"
    selectedLineBgColor:
      - "#3b4252"
    optionsTextColor:
      - "#81a1c1"
    cherryPickedCommitBgColor:
      - "#434c5e"
    cherryPickedCommitFgColor:
      - "#88c0d0"
    unstagedChangesColor:
      - "#bf616a"

os:
  editPreset: nvim

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
  parseEmoji: false

confirmOnQuit: false
disableStartupPopups: true
